# =============================================================================
# Sentinel — CI/CD pipeline
# =============================================================================
# Runs on every push to main and every pull request.
#
# Jobs:
#   1. lint-typecheck — ESLint + tsc --noEmit
#   2. test           — Vitest unit tests + coverage artifact
#   3. build          — Next.js production build (depends on 1 + 2)
#   4. docker         — Build the production Docker image (main branch only)
#
# Bun is used as the package manager / runtime (matches local dev).
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint + Type-check
  # ---------------------------------------------------------------------------
  lint-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ./.next/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bunx tsc --noEmit --pretty

  # ---------------------------------------------------------------------------
  # 2. Unit tests (Vitest)
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-test-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        # Provide validated env so the config module loads without a real DB.
        env:
          NODE_ENV: test
          DATABASE_URL: file:./db/test.db
          DATABASE_PROVIDER: sqlite
          NEXTAUTH_SECRET: ci-placeholder-secret-at-least-32-chars-long
          NEXTAUTH_URL: http://localhost:3000
        run: bunx vitest run --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 3. Production build (Next.js standalone)
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ./.next/cache
          key: ${{ runner.os }}-bun-build-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Build Next.js (standalone)
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_NAME: Sentinel
          NEXT_PUBLIC_APP_VERSION: 0.1.0
          NEXT_PUBLIC_API_VERSION: v1
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          DATABASE_PROVIDER: postgresql
          NEXTAUTH_SECRET: build-time-placeholder-secret-32chars-min
          NEXTAUTH_URL: http://localhost:3000
        run: bunx next build

      - name: Upload standalone build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: |
            .next/standalone
            .next/static
            public
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 4. Docker image build (main branch only)
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/sentinel-web
            sentinel-web
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Sentinel Web
            org.opencontainers.image.description=AI-native Community Intelligence platform

      - name: Build image (no push without registry credentials)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: ${{ github.event_name == 'push' && secrets.GITHUB_TOKEN != '' && false }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Inspect built image
        run: |
          docker images --filter "reference=sentinel-web*" --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}\t{{.CreatedAt}}" || true
